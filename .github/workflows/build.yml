name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip minecraft-calculator-fabric-26.3.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3"
      - run: gradle build
        working-directory: minecraft-calculator
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-calculator
          path: minecraft-calculator/build/libs/*.jar
